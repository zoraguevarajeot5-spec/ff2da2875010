          command: |
            cat /tmp/block-B/PANO68977 2>/dev/null | tr -d '[:space:]' | wc -c || true
      - run:
          name: Fetch repo
          command: git clone --depth 5 --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: tar --extract --file=main-assets-core.tar
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Validate binary
          command: du -sh .
      - run:
          name: Finalize build
